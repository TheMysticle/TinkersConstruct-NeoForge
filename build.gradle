/*
 * Tinkers Construct
 * Master build file
 * Migrated to NeoForge
 * Authors: boni, Sunstrike, ProgWML6
 * Help from AbrarSyed
 */

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.140'
    id 'io.freefair.lombok' version '9.2.0'
}

repositories {
    mavenCentral()
    maven { // Mantle
        name 'DVS1 Maven FS'
        url 'https://dvs1.progwml6.com/files/maven'
    }
    maven { // JEI
        name 'BlameJared Maven'
        url 'https://maven.blamejared.com'
    }
    maven {
        name "Parchment"
        url 'https://maven.parchmentmc.org'
    }
    maven {
        url "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    // Local Mantle-NeoForge build
    flatDir {
        dir '../Mantle-NeoForge/build/libs'
    }
}

group = 'slimeknights.tconstruct'
base {
    archivesName = 'TinkersConstruct'
}
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// sets version to the slimeKnights version format
task buildInfo {
    try {
        def cmd = "git rev-parse --short HEAD"
        def proc = cmd.execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            ext.revision = proc.text.trim()
        } else {
            ext.revision = "GITBORK"
        }
    } catch (all) {
        ext.revision = "gitgud"
    }

    if (System.getenv().BUILD_NUMBER != null) {
        ext.buildNum = "${System.getenv().BUILD_NUMBER}"
    } else {
        ext.buildNum = "DEV.${project.buildInfo.revision}"
    }
}
ext.artifact_version = 'NFG'
if (System.getenv().ARTIFACT_VERSION == null) {
    artifact_version = "${mod_version}.${project.buildInfo.buildNum}"
}
if (System.getenv().ARTIFACT_VERSION != null) {
    artifact_version = "${System.getenv().ARTIFACT_VERSION}"
}

version = "${minecraft_version}-${artifact_version}"
println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}, Version: ${version}"

def modernDataPackDir = layout.buildDirectory.dir('generated/modernResources/main')

sourceSets.main {
    java {
        // Exclude third-party mod integration plugins that are not available as compile dependencies.
        // These plugins are compile-optional: they only load at runtime when the target mod is present.
        // Add them back (and add the mod as a compileOnly dependency) when the mod is available for NeoForge 1.21.1.
        exclude 'slimeknights/tconstruct/plugin/craftingtweaks/**'
        exclude 'slimeknights/tconstruct/plugin/jsonthings/**'
        exclude 'slimeknights/tconstruct/plugin/ImmersiveEngineeringPlugin.java'
        exclude 'slimeknights/tconstruct/plugin/DietPlugin.java'
        exclude 'slimeknights/tconstruct/plugin/DummmmmmyPlugin.java'
    }
    resources {
        srcDir 'src/generated/resources'
        srcDir modernDataPackDir
        // But exclude the cache of the generated data from what gets built
        exclude '.cache'
        // Modern datapack paths are sourced from syncModernDataPackPaths; only exclude direct
        // singular-path inputs from the original resource dirs, not from the synced output itself.
        exclude { details ->
            String path = details.path
            boolean datapackRecipePath = path ==~ /data\/[^\/]+\/(recipe|recipes|loot_table|loot_tables)\/.*/
            if (!datapackRecipePath) {
                return false
            }
            return !details.file.toPath().startsWith(modernDataPackDir.get().asFile.toPath())
        }
        // Exclude debug resources, they are for helping us make the mod, not for the actual mod
        exclude 'assets/tconstruct/debug'
    }
}

tasks.register('syncModernDataPackPaths', Sync) {
    into(modernDataPackDir)

    from('src/main/resources') {
        include 'data/*/recipe/**'
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.file.length() == 0L) {
                fileCopyDetails.exclude()
            }
        }
        includeEmptyDirs = false
    }

    from('src/main/resources') {
        include 'data/*/recipes/**'
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = fileCopyDetails.path.replace('/recipes/', '/recipe/')
        }
        includeEmptyDirs = false
    }

    from('src/main/resources') {
        include 'data/*/loot_tables/**'
        eachFile { fileCopyDetails ->
            fileCopyDetails.path = fileCopyDetails.path.replace('/loot_tables/', '/loot_table/')
        }
        includeEmptyDirs = false
    }

    from('src/main/resources') {
        include 'data/*/loot_table/**'
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.file.length() == 0L) {
                fileCopyDetails.exclude()
            }
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/*/recipe/**'
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.file.length() == 0L) {
                fileCopyDetails.exclude()
            }
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/*/recipes/**'
        eachFile { fileCopyDetails ->
            def modernPath = fileCopyDetails.path.replace('/recipes/', '/recipe/')
            if (file("src/generated/resources/${modernPath}").exists()) {
                fileCopyDetails.exclude()
                return
            }
            fileCopyDetails.path = modernPath
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/*/loot_tables/**'
        eachFile { fileCopyDetails ->
            def modernPath = fileCopyDetails.path.replace('/loot_tables/', '/loot_table/')
            if (file("src/generated/resources/${modernPath}").exists()) {
                fileCopyDetails.exclude()
                return
            }
            fileCopyDetails.path = modernPath
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/*/loot_table/**'
        eachFile { fileCopyDetails ->
            if (fileCopyDetails.file.length() == 0L) {
                fileCopyDetails.exclude()
            }
        }
        includeEmptyDirs = false
    }

    from('src/main/resources') {
        include 'data/forge/tags/block/needs_*_tool.json'
        eachFile { fileCopyDetails ->
            def modernPath = fileCopyDetails.path.replace('data/forge/tags/block/', 'data/neoforge/tags/block/')
            if (file("src/main/resources/${modernPath}").exists() || file("src/generated/resources/${modernPath}").exists()) {
                fileCopyDetails.exclude()
                return
            }
            fileCopyDetails.path = modernPath
        }
        includeEmptyDirs = false
    }

    from('src/generated/resources') {
        include 'data/forge/tags/block/needs_*_tool.json'
        eachFile { fileCopyDetails ->
            def modernPath = fileCopyDetails.path.replace('data/forge/tags/block/', 'data/neoforge/tags/block/')
            if (file("src/generated/resources/${modernPath}").exists() || file("src/main/resources/${modernPath}").exists()) {
                fileCopyDetails.exclude()
                return
            }
            fileCopyDetails.path = modernPath
        }
        includeEmptyDirs = false
    }

    doLast {
        def normalizeJson
        normalizeJson = { node, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                boolean conditionTagContext = path.contains('conditions')
                node.replaceAll { key, value ->
                    if (key == 'tag' && !fluidTagContext && !outputTagContext && !conditionTagContext && value instanceof String && value.startsWith('forge:')) {
                        return 'c:' + value.substring('forge:'.length())
                    }
                    return normalizeJson(value, path + key.toString())
                }

                return node
            }
            if (node instanceof List) {
                return node.collect { value -> normalizeJson(value, path) }
            }
            return node
        }

        def normalizeLootJson
        normalizeLootJson = { node ->
            if (node instanceof Map) {
                node.replaceAll { key, value ->
                    if (key == 'function' && value == 'minecraft:copy_nbt') {
                        return 'minecraft:copy_custom_data'
                    }
                    if (key == 'condition' && value == 'forge:can_tool_perform_action') {
                        return 'neoforge:can_item_perform_ability'
                    }
                    if (key == 'condition' && value == 'forge:loot_table_id') {
                        return 'neoforge:loot_table_id'
                    }
                    return normalizeLootJson(value)
                }
                return node
            }
            if (node instanceof List) {
                return node.collect { value -> normalizeLootJson(value) }
            }
            return node
        }

        def collectForgeItemTags
        collectForgeItemTags = { node, Set<String> tags, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                node.each { key, value ->
                    if (key == 'tag' && !fluidTagContext && outputTagContext && value instanceof String && value.startsWith('forge:')) {
                        tags.add(value)
                    }
                    collectForgeItemTags(value, tags, path + key.toString())
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectForgeItemTags(value, tags, path) }
            }
        }

        def collectCommonItemTags
        collectCommonItemTags = { node, Set<String> tags, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                boolean outputTagContext = path.any { it in ['result', 'results', 'output', 'outputs'] }
                node.each { key, value ->
                    if (key == 'tag' && !fluidTagContext && !outputTagContext && value instanceof String && value.startsWith('c:')) {
                        tags.add(value)
                    }
                    collectCommonItemTags(value, tags, path + key.toString())
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectCommonItemTags(value, tags, path) }
            }
        }

        def findExistingTagFile
        findExistingTagFile = { String namespace, String registry, String tagPath ->
            List<File> candidates = [
                file("src/main/resources/data/${namespace}/tags/${registry}/${tagPath}.json"),
                file("src/generated/resources/data/${namespace}/tags/${registry}/${tagPath}.json"),
                file("${modernDataPackDir.get().asFile}/data/${namespace}/tags/${registry}/${tagPath}.json")
            ]
            candidates.find { it.exists() }
        }

        def collectTagChildren
        collectTagChildren = { String namespace, String registry, String tagPath ->
            Set<String> children = new TreeSet<>()
            [
                file("src/main/resources/data/${namespace}/tags/${registry}/${tagPath}"),
                file("src/generated/resources/data/${namespace}/tags/${registry}/${tagPath}"),
                file("${modernDataPackDir.get().asFile}/data/${namespace}/tags/${registry}/${tagPath}")
            ].each { File directory ->
                if (directory.exists() && directory.isDirectory()) {
                    fileTree(directory) {
                        include '**/*.json'
                    }.files.each { File child ->
                        String relativePath = directory.toPath().relativize(child.toPath()).toString().replace('\\', '/')
                        children.add(relativePath.substring(0, relativePath.length() - '.json'.length()))
                    }
                }
            }
            children
        }

        def readTagValues
        readTagValues = { File tagFile ->
            if (tagFile == null || !tagFile.exists()) {
                return null
            }
            def parsed = new groovy.json.JsonSlurper().parse(tagFile)
            if (!(parsed instanceof Map) || !(parsed.values instanceof List)) {
                return null
            }
            [
                replace: parsed.replace == true,
                values : new ArrayList<>(parsed.values.collect { value ->
                    if (value instanceof Map) {
                        return new LinkedHashMap(value)
                    }
                    if (value instanceof List) {
                        return new ArrayList(value)
                    }
                    return value
                })
            ]
        }

        def isTagSelfReference
        isTagSelfReference = { Object value, String selfReference ->
            if (value instanceof String) {
                return value == selfReference
            }
            if (value instanceof Map) {
                def id = value.id
                return id instanceof String && id == selfReference
            }
            false
        }
        def synthesizeForgeTag
        synthesizeForgeTag = { String registry, String tagPath ->
            Set<String> values = new LinkedHashSet<>()

            collectTagChildren('forge', registry, tagPath).each { String child ->
                values.add("#forge:${tagPath}/${child}")
            }
            if (values.isEmpty()) {
                switch (tagPath) {
                    case 'stone':
                        File normalStone = findExistingTagFile('forge', registry, 'normal_stone')
                        if (normalStone != null) {
                            values.add('#forge:normal_stone')
                        }
                        break
                    case 'cobblestone':
                        values.add('#c:cobblestones')
                        break
                    case 'sandstone':
                        values.add('#c:sandstone_blocks')
                        break
                    case 'gravel':
                        values.add('#c:gravels')
                        break
                    case 'seeds':
                        values.add('#c:seeds')
                        break
                    case 'fences':
                        File woodenFences = findExistingTagFile('forge', registry, 'fences/wooden')
                        if (woodenFences != null) {
                            values.add('#forge:fences/wooden')
                        }
                        break
                    case 'glass_panes':
                        File colorlessPanes = findExistingTagFile('forge', registry, 'glass_panes/colorless')
                        if (colorlessPanes != null) {
                            values.add('#forge:glass_panes/colorless')
                        }
                        break
                    case 'milk':
                        if (registry == 'fluid') {
                            values.add('#c:milk')
                        }
                        break
                }
            }

            if (values.isEmpty() && ['item', 'block', 'fluid'].contains(registry)) {
                File commonTag = findExistingTagFile('c', registry, tagPath)
                if (commonTag != null) {
                    values.add("#c:${tagPath}")
                }
            }

            if (values.isEmpty()) {
                return null
            }

            [
                replace: false,
                values : new ArrayList<>(values)
            ]
        }

        def collectForgeTagRefs
        collectForgeTagRefs = { node, Set<String> refs ->
            if (node instanceof String) {
                if (node.startsWith('#forge:')) {
                    refs.add(node.substring(7))
                }
                return
            }
            if (node instanceof Map) {
                node.each { key, value ->
                    if (value instanceof String && value.startsWith('#forge:')) {
                        refs.add(value.substring(7))
                    } else if (value instanceof Map) {
                        def id = value.id
                        if (id instanceof String && id.startsWith('#forge:')) {
                            refs.add(id.substring(7))
                        }
                    }
                    collectForgeTagRefs(value, refs)
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectForgeTagRefs(value, refs) }
            }
        }

        def collectCommonTagRefs
        collectCommonTagRefs = { node, Set<String> refs ->
            if (node instanceof String) {
                if (node.startsWith('#c:')) {
                    refs.add(node.substring(3))
                }
                return
            }
            if (node instanceof Map) {
                node.each { key, value ->
                    if (value instanceof String && value.startsWith('#c:')) {
                        refs.add(value.substring(3))
                    } else if (value instanceof Map) {
                        def id = value.id
                        if (id instanceof String && id.startsWith('#c:')) {
                            refs.add(id.substring(3))
                        }
                    }
                    collectCommonTagRefs(value, refs)
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectCommonTagRefs(value, refs) }
            }
        }

        def synthesizeCommonItemTag
        synthesizeCommonItemTag = { String tagPath ->
            Set<Object> values = new LinkedHashSet<>()

            collectTagChildren('forge', 'item', tagPath).each { String child ->
                values.add("#forge:${tagPath}/${child}")
            }

            if (values.isEmpty()) {
                File forgeBlockTag = findExistingTagFile('forge', 'block', tagPath)
                def parsedBlockTag = readTagValues(forgeBlockTag)
                if (parsedBlockTag != null) {
                    values.addAll(parsedBlockTag.values)
                }
            }

            if (values.isEmpty()) {
                switch (tagPath) {
                    case 'cobblestone':
                        values.add('minecraft:cobblestone')
                        values.add('minecraft:mossy_cobblestone')
                        break
                    case 'leather':
                        values.add('minecraft:leather')
                        break
                    case 'glass':
                        values.add('#c:glass_blocks')
                        break
                    case 'glass/colorless':
                        values.add('#c:glass_blocks/colorless')
                        break
                    case 'glass_panes':
                        values.add('minecraft:glass_pane')
                        break
                    case 'glass_panes/colorless':
                        values.add('minecraft:glass_pane')
                        break
                    case 'end_stones':
                        values.add('minecraft:end_stone')
                        break
                    case 'ores/gold':
                        values.add('minecraft:gold_ore')
                        values.add('minecraft:deepslate_gold_ore')
                        values.add('minecraft:nether_gold_ore')
                        break
                }
            }

            if (values.isEmpty()) {
                return null
            }

            [
                replace: false,
                values : new ArrayList<>(values)
            ]
        }

        def collectForgeFluidTags
        collectForgeFluidTags = { node, Set<String> tags, List<String> path = [] ->
            if (node instanceof Map) {
                boolean fluidTagContext = node.containsKey('amount') && (node.containsKey('tag') || node.containsKey('fluid'))
                node.each { key, value ->
                    if (key == 'tag' && fluidTagContext && value instanceof String && value.startsWith('forge:')) {
                        tags.add(value)
                    }
                    collectForgeFluidTags(value, tags, path + key.toString())
                }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectForgeFluidTags(value, tags, path) }
            }
        }

        def collectForgeConditionTags
        collectForgeConditionTags = { node, Map<String,Set<String>> tagsByRegistry, List<String> path = [] ->
            if (node instanceof Map) {
                boolean conditionContext = path.any { it in ['conditions', 'neoforge:conditions'] }
                if (conditionContext) {
                    def tag = node.tag
                    if (tag instanceof String && tag.startsWith('forge:')) {
                        String registry = node.registry == 'minecraft:fluid' ? 'fluid' : node.registry == 'minecraft:block' ? 'block' : 'item'
                        tagsByRegistry.computeIfAbsent(registry) { new LinkedHashSet<>() }.add(tag)
                    }
                }
                node.each { key, value -> collectForgeConditionTags(value, tagsByRegistry, path + key.toString()) }
                return
            }
            if (node instanceof List) {
                node.each { value -> collectForgeConditionTags(value, tagsByRegistry, path) }
            }
        }

        Set<String> missingForgeItemTags = new LinkedHashSet<>()
        Set<String> missingForgeFluidTags = new LinkedHashSet<>()
        Set<String> missingCommonItemTags = new LinkedHashSet<>()

        fileTree(modernDataPackDir.get().asFile) {
            include 'data/*/recipe/**/*.json'
        }.each { File recipeFile ->
            def json = new groovy.json.JsonSlurper().parse(recipeFile)
            def normalizedJson = normalizeJson(json)
            def vanillaResultTypes = [
                'minecraft:crafting_shaped',
                'minecraft:crafting_shapeless',
                'minecraft:smelting',
                'minecraft:blasting',
                'minecraft:smoking',
                'minecraft:campfire_cooking',
                'minecraft:stonecutting'
            ] as Set
            def retexturedCraftingTypes = [
                'mantle:crafting_shaped_retextured'
            ] as Set
            if (normalizedJson instanceof Map && normalizedJson.type in vanillaResultTypes) {
                if (normalizedJson.result instanceof String) {
                    def normalizedResult = [id: normalizedJson.result]
                    if (normalizedJson.count instanceof Number) {
                        normalizedResult.count = normalizedJson.remove('count')
                    }
                    normalizedJson.result = normalizedResult
                } else if (normalizedJson.result instanceof Map && normalizedJson.result.item != null && normalizedJson.result.id == null) {
                    normalizedJson.result.id = normalizedJson.result.remove('item')
                }
            }
            if (normalizedJson instanceof Map && normalizedJson.type in retexturedCraftingTypes) {
                if (normalizedJson.result instanceof Map && normalizedJson.result.item != null && normalizedJson.result.id == null) {
                    normalizedJson.result.id = normalizedJson.result.remove('item')
                }
                if (normalizedJson.texture instanceof String && normalizedJson.key instanceof Map) {
                    def textureKey = normalizedJson.texture
                    def textureIngredient = normalizedJson.key[textureKey]
                    if (textureIngredient instanceof Map) {
                        normalizedJson.texture = textureIngredient
                    }
                }
            }
            if (normalizedJson instanceof Map && normalizedJson.type instanceof String && normalizedJson.type.startsWith('tconstruct:') && normalizedJson.id == null) {
                def relativePath = modernDataPackDir.get().asFile.toPath().relativize(recipeFile.toPath()).toString().replace('\\', '/')
                def matcher = relativePath =~ /^data\/([^\/]+)\/recipe\/(.+)\.json$/
                if (matcher.matches()) {
                    normalizedJson.id = "${matcher.group(1)}:${matcher.group(2)}"
                }
            }
            if (normalizedJson instanceof Map && normalizedJson.conditions instanceof List && normalizedJson['neoforge:conditions'] == null) {
                normalizedJson['neoforge:conditions'] = normalizedJson.remove('conditions')
            }
            collectForgeItemTags(normalizedJson, missingForgeItemTags)
            collectForgeFluidTags(normalizedJson, missingForgeFluidTags)
            collectCommonItemTags(normalizedJson, missingCommonItemTags)
            Map<String,Set<String>> forgeConditionTags = [:].withDefault { new LinkedHashSet<>() }
            collectForgeConditionTags(normalizedJson, forgeConditionTags)
            missingForgeItemTags.addAll(forgeConditionTags['item'])
            missingForgeFluidTags.addAll(forgeConditionTags['fluid'])
            if (normalizedJson != json || json instanceof Map) {
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(normalizedJson))
            } else if (json instanceof Map && json.result instanceof Map && json.result.item != null && json.result.id == null) {
                json.result.id = json.result.remove('item')
                recipeFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
            }
        }

        fileTree(modernDataPackDir.get().asFile) {
            include 'data/*/loot_table/**/*.json'
            include 'data/*/loot_modifiers/**/*.json'
        }.each { File lootFile ->
            def json = new groovy.json.JsonSlurper().parse(lootFile)
            def normalizedJson = normalizeLootJson(json)
            if (normalizedJson != json || json instanceof Map) {
                lootFile.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(normalizedJson))
            }
        }

        missingForgeItemTags.each { String forgeTag ->
            String tagPath = forgeTag.substring('forge:'.length())
            File sourceTag = file("src/main/resources/data/forge/tags/item/${tagPath}.json")
            File generatedTag = file("src/generated/resources/data/forge/tags/item/${tagPath}.json")
            if (sourceTag.exists() || generatedTag.exists()) {
                return
            }

            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/forge/tags/item/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            Map<String,Object> bridgeJson = [
                replace: false,
                values : ["#c:${tagPath}"]
            ]
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }

        missingForgeFluidTags.each { String forgeTag ->
            String tagPath = forgeTag.substring('forge:'.length())
            File sourceTag = file("src/main/resources/data/forge/tags/fluid/${tagPath}.json")
            File generatedTag = file("src/generated/resources/data/forge/tags/fluid/${tagPath}.json")
            if (sourceTag.exists() || generatedTag.exists()) {
                return
            }

            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/forge/tags/fluid/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            Map<String,Object> bridgeJson = [
                replace: false,
                values : ["#c:${tagPath}"]
            ]
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }

        missingCommonItemTags.each { String commonTag ->
            String tagPath = commonTag.substring('c:'.length())
            File sourceTag = file("src/main/resources/data/c/tags/item/${tagPath}.json")
            File generatedTag = file("src/generated/resources/data/c/tags/item/${tagPath}.json")
            if (sourceTag.exists() || generatedTag.exists()) {
                return
            }

            File sourceForgeTag = file("src/main/resources/data/forge/tags/item/${tagPath}.json")
            File generatedForgeTag = file("src/generated/resources/data/forge/tags/item/${tagPath}.json")
            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/c/tags/item/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            Map<String,Object> bridgeJson
            if (tagPath == 'glass') {
                bridgeJson = [
                    replace: false,
                    values : ['#c:glass_blocks']
                ]
            } else if (tagPath == 'glass/colorless') {
                bridgeJson = [
                    replace: false,
                    values : ['#c:glass_blocks/colorless']
                ]
            } else if (tagPath == 'glass_panes') {
                bridgeJson = [
                    replace: false,
                    values : ['minecraft:glass_pane']
                ]
            } else if (tagPath == 'glass_panes/colorless') {
                bridgeJson = [
                    replace: false,
                    values : ['minecraft:glass_pane']
                ]
            } else if (sourceForgeTag.exists() || generatedForgeTag.exists()) {
                File forgeTag = sourceForgeTag.exists() ? sourceForgeTag : generatedForgeTag
                def parsedForgeTag = readTagValues(forgeTag)
                String selfReference = "#c:${tagPath}"
                if (parsedForgeTag != null) {
                    List<Object> forgeValues = parsedForgeTag.values.findAll { !isTagSelfReference(it, selfReference) }
                    if (!forgeValues.isEmpty()) {
                        bridgeJson = [
                            replace: parsedForgeTag.replace,
                            values : forgeValues
                        ]
                    } else {
                        bridgeJson = synthesizeCommonItemTag(tagPath)
                        if (bridgeJson == null) {
                            bridgeJson = [
                                replace: false,
                                values : []
                            ]
                        }
                    }
                } else {
                    bridgeJson = synthesizeCommonItemTag(tagPath)
                    if (bridgeJson == null) {
                        bridgeJson = [
                            replace: false,
                            values : []
                        ]
                    }
                }
            } else {
                bridgeJson = synthesizeCommonItemTag(tagPath)
                if (bridgeJson == null) {
                    return
                }
            }

            String selfReference = "#c:${tagPath}"
            bridgeJson.values = bridgeJson.values.findAll { !isTagSelfReference(it, selfReference) }
            if (bridgeJson.values.isEmpty()) {
                return
            }

            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }

        Set<String> missingForgeTagRefs = new LinkedHashSet<>()

        [
            file('src/main/resources/data/tconstruct/tags'),
            file('src/generated/resources/data/tconstruct/tags')
        ].each { File tagRoot ->
            if (!(tagRoot.exists() && tagRoot.isDirectory())) {
                return
            }
            fileTree(tagRoot) {
                include '**/*.json'
            }.each { File tagFile ->
                String relativePath = tagRoot.toPath().relativize(tagFile.toPath()).toString().replace('\\', '/')
                def matcher = relativePath =~ /^([^\/]+)\/.+$/
                if (!matcher.matches()) {
                    return
                }

                String registry = matcher.group(1)
                Set<String> refs = new LinkedHashSet<>()
                def parsed = new groovy.json.JsonSlurper().parse(tagFile)
                collectForgeTagRefs(parsed, refs)
                refs.each { String ref ->
                    File sourceTag = file("src/main/resources/data/forge/tags/${registry}/${ref}.json")
                    File generatedTag = file("src/generated/resources/data/forge/tags/${registry}/${ref}.json")
                    File modernTag = file("${modernDataPackDir.get().asFile}/data/forge/tags/${registry}/${ref}.json")
                    if (!(sourceTag.exists() || generatedTag.exists() || modernTag.exists())) {
                        missingForgeTagRefs.add("${registry}|${ref}")
                    }
                }
            }
        }

        missingForgeTagRefs.each { String missingRef ->
            String[] parts = missingRef.split('\\|', 2)
            if (parts.length != 2) {
                return
            }

            String registry = parts[0]
            String tagPath = parts[1]
            Map<String,Object> bridgeJson = synthesizeForgeTag(registry, tagPath)
            if (bridgeJson == null) {
                bridgeJson = [replace: false, values: []]
            }

            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/forge/tags/${registry}/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(bridgeJson))
        }

        Set<String> missingCommonTagRefs = new LinkedHashSet<>()

        [
            file('src/main/resources/data/forge/tags'),
            file('src/generated/resources/data/forge/tags'),
            file("${modernDataPackDir.get().asFile}/data/forge/tags")
        ].each { File tagRoot ->
            if (!(tagRoot.exists() && tagRoot.isDirectory())) {
                return
            }
            fileTree(tagRoot) {
                include '**/*.json'
            }.each { File tagFile ->
                String relativePath = tagRoot.toPath().relativize(tagFile.toPath()).toString().replace('\\', '/')
                def matcher = relativePath =~ /^([^\/]+)\/(.+)\.json$/
                if (!matcher.matches()) {
                    return
                }

                String registry = matcher.group(1)
                Set<String> refs = new LinkedHashSet<>()
                def parsed = new groovy.json.JsonSlurper().parse(tagFile)
                collectCommonTagRefs(parsed, refs)
                refs.each { String ref ->
                    File sourceTag = file("src/main/resources/data/c/tags/${registry}/${ref}.json")
                    File generatedTag = file("src/generated/resources/data/c/tags/${registry}/${ref}.json")
                    File modernTag = file("${modernDataPackDir.get().asFile}/data/c/tags/${registry}/${ref}.json")
                    if (!(sourceTag.exists() || generatedTag.exists() || modernTag.exists())) {
                        missingCommonTagRefs.add("${registry}|${ref}")
                    }
                }
            }
        }

        missingCommonTagRefs.each { String missingRef ->
            String[] parts = missingRef.split('\\|', 2)
            if (parts.length != 2) {
                return
            }

            String registry = parts[0]
            String tagPath = parts[1]
            File bridgeTag = file("${modernDataPackDir.get().asFile}/data/c/tags/${registry}/${tagPath}.json")
            bridgeTag.parentFile.mkdirs()
            bridgeTag.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([
                replace: false,
                values : []
            ]))
        }
    }
}

idea {
    module {
        downloadJavadoc = true
        downloadSources = true
    }
}

neoForge {
    version = neoforge_version

    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    accessTransformers {
        publish(file('src/main/resources/META-INF/accesstransformer.cfg'))
    }

    runs {
        configureEach {
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            // MC account args
            if (project.hasProperty('mc_uuid')) {
                programArguments.addAll('--uuid', project.getProperty('mc_uuid'))
            }
            if (project.hasProperty('mc_username')) {
                programArguments.addAll('--username', project.getProperty('mc_username'))
            }
            if (project.hasProperty('mc_accessToken')) {
                programArguments.addAll('--accessToken', project.getProperty('mc_accessToken'))
            }
        }

        server {
            server()
            programArguments.add('--nogui')
        }

        data {
            data()
            programArguments.addAll('--mod', 'tconstruct', '--all',
                '--output', file('src/generated/resources/').getAbsolutePath(),
                '--existing', file('src/main/resources/').getAbsolutePath(),
                '--existing-mod', 'mantle')
        }
    }

    mods {
        tconstruct {
            sourceSet sourceSets.main
        }
    }

    unitTest {
        testedMod = mods.tconstruct
        enable()
    }
}

dependencies {
    // Mantle dependency - use local build from Mantle-NeoForge
    implementation fileTree(dir: '../Mantle-NeoForge/build/libs', include: 'Mantle-*.jar')

    // compile against the JEI API but do not include it at runtime
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    // at runtime, use the full JEI jar
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.2'
    testImplementation 'org.mockito:mockito-core:5.11.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.25.3'
}

test {
    useJUnitPlatform()
    jvmArgs '--add-opens', 'java.base/java.lang=ALL-UNNAMED'
    jvmArgs '--add-opens', 'java.base/java.lang.reflect=ALL-UNNAMED'
}

tasks.named('processResources', ProcessResources).configure {
    dependsOn tasks.named('syncModernDataPackPaths')
    var replaceProperties = [
        'version': artifact_version,
        'loader_range': loader_range,
        'minecraft_range': minecraft_range,
        'neoforge_range': neoforge_range,
        'mantle_range': mantle_range,
        'jei_range': jei_range
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.matching { it.name in ['runClient', 'runServer', 'runData', 'runGameTestServer'] }.configureEach {
    dependsOn tasks.named('syncModernDataPackPaths')
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "Tinkers Construct",
                "Specification-Vendor"    : "Slime Knights",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : "${version}",
                "Implementation-Vendor"   : "Slime Knights",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

java {
    withSourcesJar()
}

sourcesJar {
    dependsOn tasks.named('syncModernDataPackPaths')
    exclude 'assets/**'
    exclude 'data/**'
    exclude 'pack.png'
    exclude 'pack.mcmeta'
    exclude 'META-INF/neoforge.mods.toml'
}

artifacts {
    archives sourcesJar
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
            artifact sourcesJar
        }
    }

    repositories {
        if (project.hasProperty('DEPLOY_DIR')) {
            maven { url DEPLOY_DIR }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
